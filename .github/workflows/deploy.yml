---
name: Deploy static content to Pages

"on":
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: >-
        ${{
          steps.deploy_retry.outputs.page_url || steps.deploy.outputs.page_url
        }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Retry deploy to GitHub Pages
        if: steps.deploy.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v5
      - name: Fail when both deployments fail
        if: >-
          steps.deploy.outcome == 'failure' &&
          steps.deploy_retry.outcome == 'failure'
        run: exit 1
